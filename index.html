<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PINKYVANTH — One name. One world. Infinite identities.</title>
<meta name="description" content="PINKYVANTH: an endless universe of fictional demonstration profiles named Pinky.">
<meta name="theme-color" content="#0a0a0d">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brandrow">
    <div>
      <h1 class="brand">PINKYVANTH</h1>
      <p class="tag">ONE NAME. ONE WORLD. INFINITE IDENTITIES.</p>
    </div>
    <div class="stat" aria-live="polite"><b id="total">0</b><span>fictional profiles generated</span></div>
  </div>
  <form class="search" id="searchForm" role="search" autocomplete="off">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" inputmode="search" placeholder="Search ID, name, country or profession" aria-label="Search profiles" spellcheck="false">
    <button type="button" id="clear" class="clear" aria-label="Clear search" hidden>&times;</button>
  </form>
  <nav class="disc" aria-label="Country discovery">
    <div class="tabs" id="regions"></div>
    <div class="chips" id="countries"></div>
    <div class="chips cats" id="cats" aria-label="Profession categories"></div>
  </nav>
</header>

<main>
  <section id="results" class="results" hidden>
    <div class="rhead"><span id="rinfo"></span><button type="button" id="rclose">Back to feed</button></div>
    <div class="grid" id="rgrid"></div>
  </section>

  <p class="notice">Every profile here is a fictional, AI-style demonstration persona. None are real people.</p>
  <section class="grid" id="feed" aria-label="Profile feed"></section>
  <div id="sentinel" aria-hidden="true"></div>
</main>

<noscript><p class="notice">PINKYVANTH needs JavaScript to generate its profiles.</p></noscript>
<script src="script.js"></script>
</body>
</html>
